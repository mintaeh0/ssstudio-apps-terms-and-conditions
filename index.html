<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Terms &amp; Conditions</title>
    <style>
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        padding: 1em;
      }

      .conditional-content {
        display: none;
      }

      .load-error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <main id="content" aria-live="polite">
      <p>Loading Terms &amp; Conditions…</p>
    </main>

    <noscript>
      <p>JavaScript is required to display these Terms &amp; Conditions.</p>
    </noscript>

    <script>
      async function initTerms() {
        const params = new URLSearchParams(window.location.search);
        const lang = (params.get("lang") || "").toLowerCase() === "ko" ? "ko" : "en";
        const labels = lang === "ko"
          ? {
              defaultAppName: "애플리케이션",
              title: "이용약관",
              loadError: "이용약관을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."
            }
          : {
              defaultAppName: "this",
              title: "Terms & Conditions",
              loadError: "Unable to load the Terms & Conditions. Please try again later."
            };
        const appName = params.get("app")?.trim() || labels.defaultAppName;
        const content = document.getElementById("content");

        document.documentElement.lang = lang;
        document.title = `${appName} - ${labels.title}`;

        try {
          const response = await fetch(`./terms/${lang}.html`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          content.innerHTML = await response.text();

          content.querySelectorAll(".app-name").forEach((element) => {
            element.textContent = appName;
          });

          ["gplay", "admob", "fanal", "fcrash", "rcat"].forEach((service) => {
            if (params.get(service) === "true") {
              content.querySelector(`#${service}`)?.classList.remove("conditional-content");
            }
          });
        } catch (error) {
          console.error("Failed to load terms:", error);
          content.innerHTML = "";
          const message = document.createElement("p");
          message.className = "load-error";
          message.textContent = labels.loadError;
          content.appendChild(message);
        }
      }

      initTerms();
    </script>
  </body>
</html>
